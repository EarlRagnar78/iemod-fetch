# The slow gates. Kept off the pull-request path deliberately: a contributor
# should not wait twenty minutes for a mutation run, and a nightly failure is a
# message to the maintainer, not a blocked pull request.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      # the runtime's libraries as shipped, by hash, before the extras: an
      # extra's loose range would otherwise pull a newer one than the pin
      # (test_build_zipapp builds from the pinned versions)
      - run: pip install --require-hashes -r requirements/runtime.txt
      - run: pip install -e ".[test,mutation]"

      # Coverage says a line ran. Mutation testing says the tests would have
      # NOTICED if that line were wrong, which is the thing coverage is
      # routinely mistaken for. Reported, never gating: a surviving mutant is a
      # question ("is this behaviour actually asserted?"), not a defect.
      - name: mutmut
        continue-on-error: true
        run: |
          mutmut run --paths-to-mutate iemod_fetch/ || true
          mutmut results > mutants.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: mutation-report, path: mutants.txt, retention-days: 30 }

  deep-properties:
    name: Property tests, long run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      # the runtime's libraries as shipped, by hash, before the extras: an
      # extra's loose range would otherwise pull a newer one than the pin
      # (test_build_zipapp builds from the pinned versions)
      - run: pip install --require-hashes -r requirements/runtime.txt
      - run: pip install -e ".[test]"

      # The pull-request run uses 300 examples so it stays fast. Overnight it
      # gets 20,000, which is where the rare counterexample lives.
      - name: Hypothesis with a much larger budget
        env:
          HYPOTHESIS_PROFILE: nightly
        run: python -m pytest tests/test_properties.py -q

  # The upstream data check moved to community-data.yml, which refreshes it
  # the way a run does (ADR-0032) instead of cloning it.
