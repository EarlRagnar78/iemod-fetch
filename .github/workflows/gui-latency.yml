# What holds the wizard's event loop on each runner. The M3 end-to-end test
# asserts it never waits 100 ms; the release gate of 4.0.0 measured 240 ms on
# windows-latest while the CI run of the same commit passed. This runs that
# test many times with IEMOD_LATENCY_TRACE and lines up every long gap with
# the garbage collections and the page's events (tools/gui_latency_summary.py),
# so the fix answers a measurement, not a guess.
name: GUI latency

on:
  pull_request:
    paths: ["tools/gui_latency_summary.py", ".github/workflows/gui-latency.yml",
            "tests/gui/test_m3_end_to_end.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Event-loop gaps on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      IEMOD_REQUIRE_GUI: "1"
      RUNS: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt's system libraries (EGL, xkbcommon, fontconfig)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install --require-hashes -r requirements/runtime.txt
      - run: pip install -e ".[guitest]"
      - name: The M3 test, ${{ env.RUNS }} times, traced
        shell: bash
        run: |
          # relative: the test resolves it against where pytest ran (Git
          # Bash's $PWD, /d/a/..., is no path Windows' Python can open)
          mkdir -p traces
          for i in $(seq -w 1 "$RUNS"); do
            IEMOD_LATENCY_TRACE="traces/trace-$i.json" \
              python -m pytest -q -p no:cacheprovider tests/gui/test_m3_end_to_end.py \
              > "traces/pytest-$i.txt" 2>&1 || echo "run $i: the test failed"
          done
      - name: What held the long gaps
        shell: bash
        run: |
          python tools/gui_latency_summary.py traces/trace-*.json --over 50 | tee summary.txt
          { echo '```'; tail -n 200 summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gui-latency-${{ matrix.os }}
          path: traces/
