# Security scanning. Separate from CI so a scanner outage or a new advisory in a
# transitive dev dependency does not block an unrelated pull request — these
# report, CI gates.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"     # Monday morning: new advisories land over the weekend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "bandit[toml]"

      # Configured in pyproject.toml, where each skipped rule carries the reason
      # it is skipped. An unexplained skip is a decision nobody can revisit.
      - name: bandit
        run: bandit -q -c pyproject.toml -r iemod_fetch/

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit

      # The shipped tool has no runtime dependency at all (ADR-0002), so this
      # audits the developer toolchain — the only supply chain there is.
      - name: Audit the developer toolchain
        run: |
          pip install -e ".[dev]"
          pip-audit --strict --desc

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  workflows:
    name: Workflow SAST (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install zizmor

      # The workflows are themselves attack surface: an over-permissioned token,
      # a checkout that persists credentials, an unpinned action. This checks
      # the CI the way bandit checks the code.
      - name: zizmor
        run: zizmor --persona=regular .github/workflows/
