# Security scanning. Separate from CI so a scanner outage or a new advisory in a
# transitive dev dependency does not block an unrelated pull request — these
# report, CI gates.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"     # Monday morning: new advisories land over the weekend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      - run: pip install "bandit[toml]"

      # Configured in pyproject.toml, where each skipped rule carries the reason
      # it is skipped. An unexplained skip is a decision nobody can revisit.
      - name: bandit
        run: bandit -q -c pyproject.toml -r iemod_fetch/

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      - run: pip install pip-audit

      # What ships inside the .pyz and the bundles (ADR-0043), exactly as pinned.
      - name: Audit the runtime's libraries
        run: pip-audit --strict --desc -r requirements/runtime.txt --require-hashes --no-deps --disable-pip

      - name: Audit the developer toolchain
        run: |
          pip install -e ".[dev]"
          # Audit the installed toolchain, not the project: iemod-fetch is not
          # on PyPI, and --strict (rightly) fails on anything it cannot look
          # up. The frozen list is exactly what was installed, fully pinned.
          pip freeze --exclude-editable > toolchain.txt
          pip-audit --strict --desc -r toolchain.txt --no-deps --disable-pip

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  workflows:
    name: Workflow SAST (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      # Pinned for the same reason as the linters: a new zizmor release adds
      # audits, and an unpinned gate turns red with no change to the workflows.
      - run: pip install zizmor==1.31.1

      # The workflows are themselves attack surface: an over-permissioned token,
      # a checkout that persists credentials, an unpinned action. This checks
      # the CI the way bandit checks the code.
      - name: zizmor
        # Low/informational findings are advice (e.g. 'use gh release instead of
        # an action'); medium and above block.
        run: zizmor --persona=regular --min-severity=medium .github/workflows/
