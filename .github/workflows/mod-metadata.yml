# The authors' metadata inis, fetched from the real GitHub (ADR-0037).
#
# tests/test_premeta.py drives iemod_fetch/premeta.py with fake clients. This
# asks GitHub itself for mods whose ini only the case-insensitive listing
# (the contents API) finds, one raw.githubusercontent.com finds directly and
# one with no ini. It runs on a pull request that changes the fetch, and every
# week, because the repositories change under us. A quota or network failure
# is a warning (inconclusive), not a pass.
name: Mod metadata

on:
  pull_request:
    paths: ["iemod_fetch/premeta.py", "iemod_fetch/net.py",
            "tools/premeta_live_check.py", ".github/workflows/mod-metadata.yml"]
  schedule:
    - cron: "53 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Find metadata inis on GitHub, ignoring case
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      - name: The runtime's libraries, by hash (ADR-0043)
        run: pip install --require-hashes -r requirements/runtime.txt
      - name: premeta against GitHub
        run: |
          set +e
          python tools/premeta_live_check.py
          code=$?
          if [ "$code" = 2 ]; then
            echo "::warning::premeta live check inconclusive (network or quota)"
            exit 0
          fi
          exit "$code"
