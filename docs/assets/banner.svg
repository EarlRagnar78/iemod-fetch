<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">iemod-fetch</title>
  <desc id="d">Fetch, verify, order and install Infinity Engine mods for EET, BGEE and BG2EE, without guessing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100c"/>
      <stop offset="0.55" stop-color="#2a1d12"/>
      <stop offset="1" stop-color="#3b2614"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c47a"/>
      <stop offset="1" stop-color="#b8863b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="24" y="24" width="1232" height="272" rx="14" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="2"/>

  <!-- emblem: a shield with a check mark, for "verified" -->
  <g transform="translate(92 92)">
    <path d="M60 0 L118 22 L118 70 C118 112 92 138 60 152 C28 138 2 112 2 70 L2 22 Z"
          fill="#1b140e" stroke="url(#gold)" stroke-width="5"/>
    <path d="M32 76 L54 98 L92 52" fill="none" stroke="#e8c47a" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="262" y="138" fill="#f3e3c0" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="700" letter-spacing="1">iemod-fetch</text>
  <text x="264" y="182" fill="#d8c3a0" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="25">Infinity Engine mods for EET, BGEE and BG2EE: fetched, verified,</text>
  <text x="264" y="214" fill="#d8c3a0" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="25">ordered, conflict-checked and installed. Without guessing.</text>

  <!-- the pipeline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#14100c">
    <rect x="264" y="240" width="96" height="32" rx="16" fill="url(#gold)"/>
    <text x="312" y="262" text-anchor="middle">fetch</text>
    <rect x="376" y="240" width="96" height="32" rx="16" fill="url(#gold)"/>
    <text x="424" y="262" text-anchor="middle">verify</text>
    <rect x="488" y="240" width="96" height="32" rx="16" fill="url(#gold)"/>
    <text x="536" y="262" text-anchor="middle">order</text>
    <rect x="600" y="240" width="110" height="32" rx="16" fill="url(#gold)"/>
    <text x="655" y="262" text-anchor="middle">resolve</text>
    <rect x="726" y="240" width="96" height="32" rx="16" fill="url(#gold)"/>
    <text x="774" y="262" text-anchor="middle">install</text>
  </g>
  <g stroke="#e8c47a" stroke-width="2" stroke-opacity="0.8">
    <path d="M360 256h16M472 256h16M584 256h16M710 256h16"/>
  </g>

  <text x="1236" y="62" text-anchor="end" fill="#a8916c" font-family="Consolas, Menlo, monospace"
        font-size="16">stdlib only · Windows · Linux · macOS · MIT</text>
</svg>
